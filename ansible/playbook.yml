---
- name: Configure Healthapp web server
  hosts: web
  become: yes
  tasks:
    - name: Install nginx
      dnf:
        name: nginx
        state: present
    - name: Start and enable nginx
      systemd:
        name: nginx
        state: started
        enabled: yes
    - name: Deploy custom index page
      copy:
        dest: /usr/share/nginx/html/index.html
        content: |
          <h1>HealthApp deployed by ILO</h1>
          <p>Provisioned with Terraform and configured with Ansible.</p>
